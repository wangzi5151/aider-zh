name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Markdown lint and link check
        run: python3 scripts/check_readme.py --external README.md SYNC_CHECKLIST.md
      - name: Badge block is reproducible
        run: python3 scripts/generate_badges.py --check
